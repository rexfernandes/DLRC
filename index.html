<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition Class · DLRC Parent Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #F2F4F3;
      --surface:   #FFFFFF;
      --ink:       #0D2B22;
      --ink-2:     #4A6259;
      --ink-3:     #8FA89F;
      --header:    #0D2B22;
      --green:     #2A9D5C;
      --amber:     #E8A44A;
      --amber-bg:  #FEF7EC;
      --radius:    14px;
      --radius-sm: 8px;
      --shadow:    0 1px 3px rgba(13,43,34,.06), 0 4px 12px rgba(13,43,34,.06);

      /* Subject accent colours */
      --c-homerooms: #7C3AED;
      --c-english:   #2563EB;
      --c-numeracy:  #059669;
      --c-evlf:      #0891B2;
      --c-art:       #DB2777;
      --c-sports:    #D97706;
      --c-skills:    #9333EA;
      --c-thematics: #4F46E5;
      --c-music:     #DC2626;
      --c-default:   #64748B;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ─── HEADER ───────────────────────────────── */
    .header {
      background: var(--header);
      color: #fff;
      padding: 24px 20px 28px;
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .header-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #6BA38D;
      margin-bottom: 4px;
    }
    .header-title {
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 800;
      line-height: 1.1;
      color: #fff;
    }
    .header-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .live-dot {
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2.4s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.85)} }
    .header-status { font-size: 12px; color: #6BA38D; }

    .date-stamp {
      text-align: right;
      flex-shrink: 0;
    }
    .date-day {
      font-size: clamp(36px, 8vw, 52px);
      font-weight: 800;
      line-height: 1;
      color: #fff;
    }
    .date-label {
      font-size: 11px;
      color: #6BA38D;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-top: 2px;
    }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 12px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.15);
      color: #A8CEC2;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background .18s;
    }
    .refresh-btn:hover { background: rgba(255,255,255,.18); color: #fff; }

    /* ─── MAIN ──────────────────────────────────── */
    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ─── NOTICE BANNER ─────────────────────────── */
    .notice-banner {
      background: var(--amber-bg);
      border: 1.5px solid #EFCF85;
      border-radius: var(--radius);
      padding: 14px 16px;
      display: none;
      align-items: flex-start;
      gap: 10px;
    }
    .notice-banner.show { display: flex; }
    .notice-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .notice-text { font-size: 14px; font-weight: 600; color: #78460A; line-height: 1.45; }

    /* ─── SECTION HEADER ────────────────────────── */
    .section-hd {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
    }
    .section-hd h2 {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-hd .sub {
      font-size: 12px;
      color: var(--ink-3);
      font-weight: 500;
    }

    /* ─── GRID ──────────────────────────────────── */
    .grid-main {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 680px) {
      .grid-main { grid-template-columns: 1fr 1fr; }
      .grid-main .lessons-col { grid-column: 1 / 2; }
      .grid-main .sidebar-col { grid-column: 2 / 3; }
    }
    @media (min-width: 880px) {
      .grid-main { grid-template-columns: 2fr 1fr; }
    }

    /* ─── CARDS ─────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(13,43,34,.07);
    }

    /* ─── LESSON CARD ───────────────────────────── */
    .lesson-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(13,43,34,.07);
      border-left-width: 4px;
      padding: 14px 16px;
      transition: transform .15s, box-shadow .15s;
    }
    .lesson-card:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(13,43,34,.1); }

    .lesson-card--homerooms { border-left-color: var(--c-homerooms); }
    .lesson-card--english   { border-left-color: var(--c-english); }
    .lesson-card--numeracy  { border-left-color: var(--c-numeracy); }
    .lesson-card--evlf      { border-left-color: var(--c-evlf); }
    .lesson-card--art       { border-left-color: var(--c-art); }
    .lesson-card--sports    { border-left-color: var(--c-sports); }
    .lesson-card--skills    { border-left-color: var(--c-skills); }
    .lesson-card--thematics { border-left-color: var(--c-thematics); }
    .lesson-card--music     { border-left-color: var(--c-music); }
    .lesson-card--default   { border-left-color: var(--c-default); }

    .lesson-subject {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
    }
    .lesson-emoji { font-size: 16px; }
    .lesson-name {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ink);
    }
    .lesson-field { margin-top: 5px; }
    .lesson-field-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--ink-3);
      margin-bottom: 2px;
    }
    .lesson-field-value {
      font-size: 13.5px;
      color: var(--ink);
      line-height: 1.5;
      white-space: pre-line;
    }

    /* ─── WAH CARD ──────────────────────────────── */
    .wah-card {
      background: var(--surface);
      border-radius: var(--radius-sm);
      border: 1.5px solid #EFCF85;
      padding: 12px 14px;
    }
    .wah-card + .wah-card { margin-top: 8px; }
    .wah-subject-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #78460A;
      background: #FEECCC;
      padding: 2px 8px;
      border-radius: 20px;
      margin-bottom: 6px;
    }
    .wah-text {
      font-size: 13.5px;
      color: var(--ink);
      line-height: 1.5;
      white-space: pre-line;
    }

    /* ─── ANNOUNCEMENT CARD ──────────────────────── */
    .ann-card {
      background: var(--surface);
      border-radius: var(--radius-sm);
      border: 1px solid rgba(13,43,34,.07);
      padding: 12px 14px;
      box-shadow: 0 1px 4px rgba(13,43,34,.04);
    }
    .ann-card + .ann-card { margin-top: 8px; }
    .ann-date { font-size: 11px; color: var(--ink-3); font-weight: 500; margin-bottom: 4px; }
    .ann-text { font-size: 13.5px; color: var(--ink); line-height: 1.5; white-space: pre-line; }

    /* ─── COLLAPSIBLE ───────────────────────────── */
    .collapse-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(13,43,34,.07);
      overflow: hidden;
    }
    .collapse-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
    }
    .collapse-trigger h3 {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .collapse-arrow {
      font-size: 12px;
      color: var(--ink-3);
      transition: transform .2s;
    }
    .collapse-arrow.open { transform: rotate(180deg); }
    .collapse-body { display: none; padding: 0 18px 16px; }
    .collapse-body.open { display: block; }

    /* ─── CONTACTS TABLE ─────────────────────────── */
    .contact-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--bg);
    }
    .contact-row:last-child { border-bottom: none; }
    .contact-subject { font-size: 13px; font-weight: 600; color: var(--ink); }
    .contact-name    { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
    .contact-email-link {
      font-size: 11px;
      color: #2563EB;
      text-decoration: none;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .contact-email-link:hover { text-decoration: underline; }

    /* ─── NORMS ─────────────────────────────────── */
    .norm-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 5px 0;
      font-size: 13px;
      color: var(--ink);
      line-height: 1.4;
    }
    .norm-check { color: var(--green); font-size: 12px; margin-top: 2px; }

    /* ─── TIMETABLE ─────────────────────────────── */
    .tt-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tt-table th {
      background: var(--bg);
      color: var(--ink-2);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 7px 10px;
      border-bottom: 2px solid rgba(13,43,34,.07);
      text-align: left;
    }
    .tt-table td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--bg);
      color: var(--ink);
      vertical-align: top;
    }
    .tt-table tr:last-child td { border-bottom: none; }
    .tt-table tr:hover td { background: #F7FAF8; }

    /* ─── EMPTY / LOADING STATES ─────────────────── */
    .empty-state {
      text-align: center;
      padding: 28px 20px;
      color: var(--ink-3);
      font-size: 13px;
      line-height: 1.6;
    }
    .empty-state .emoji { font-size: 28px; display: block; margin-bottom: 8px; }
    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid var(--bg);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── GRID (lower section) ──────────────────── */
    .grid-lower {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 640px) {
      .grid-lower { grid-template-columns: 1fr 1fr; }
    }

    /* ─── FOOTER ─────────────────────────────────── */
    .footer {
      text-align: center;
      padding: 8px 16px 32px;
      font-size: 11px;
      color: var(--ink-3);
      max-width: 960px;
      margin: 0 auto;
    }
    .footer a { color: var(--ink-3); text-underline-offset: 3px; }
    .footer a:hover { color: var(--ink); }
    .footer-links { display: flex; justify-content: center; gap: 16px; margin-top: 6px; flex-wrap: wrap; }
  </style>
</head>
<body>

  <!-- ─── HEADER ──────────────────────────────────── -->
  <header class="header">
    <div class="header-inner">
      <div>
        <div class="header-eyebrow">DLRC · Transition Program 2026–27</div>
        <h1 class="header-title">Class Parent Dashboard</h1>
        <div class="header-meta">
          <span class="live-dot"></span>
          <span class="header-status" id="status-text">Connecting…</span>
        </div>
        <button class="refresh-btn" onclick="loadAll()">
          <span id="refresh-icon">↻</span> Refresh
        </button>
      </div>
      <div class="date-stamp">

        <div class="date-label" id="hdr-weekday">---</div>
        <div class="date-label" id="hdr-month" style="margin-top:3px"></div>
      </div>
    </div>

  <!-- ─── MAIN ────────────────────────────────────── -->
  <main class="main">

    <!-- Notice Banner -->
    <div class="notice-banner" id="notice-banner">
      <span class="notice-icon">📢</span>
      <p class="notice-text" id="notice-text"></p>
    </div>

    <!-- Lesson Plans + Sidebar -->
    <div class="grid-main">

      <!-- Lesson Plans -->
      <div class="lessons-col">
        <div class="section-hd">
          <h2>📖 Today's Lesson Plan</h2>

        <div>
          <div class="section-hd">

          </div>

    <!-- Lower Grid: Contacts + Class Norms -->
    <div class="grid-lower">

      <!-- Contacts -->
      <div class="collapse-card">
        <button class="collapse-trigger" onclick="toggleSection('contacts')">
          <h3>👩‍🏫 Teacher Contacts</h3>
          <span class="collapse-arrow" id="contacts-arrow">▾</span>
        </button>

        </button>
        <div class="collapse-body" id="norms-body">
          <div class="empty-state" style="padding:12px 0"><span class="spinner"></span>Loading…</div>
        </div>
      </div>

    </div>

    <!-- Timetable (full width, collapsed) -->
    <div class="collapse-card">
      <button class="collapse-trigger" onclick="toggleSection('timetable')">
        <h3>📅 Weekly Timetable</h3>
        <span class="collapse-arrow" id="timetable-arrow">▾</span>
      </button>
      <div class="collapse-body" id="timetable-body" style="overflow-x:auto;">
        <div class="empty-state" style="padding:12px 0"><span class="spinner"></span>Loading…</div>
      </div>
    </div>

  </main>

  <!-- ─── FOOTER ───────────────────────────────────── -->
  <footer class="footer">
    <div>Live data from DLRC Transition Planning Sheet</div>
    <div class="footer-links">
      <a href="https://docs.google.com/spreadsheets/d/1u25ZzFmpIy51tpL6xwfGQ7ndZI6n1RsliWgXlDgvRfI/edit" target="_blank">📊 Open Sheet</a>
      <a href="https://script.google.com/macros/s/AKfycbw91Sp7OQ-uGppWdK2a-uGXsYz344ZLt2EUU3q2LNa55TyojKTQH2znVEs-QGQpMUldcw/exec" target="_blank">📆 View Calendar</a>
      <a href="mailto:dlrc-primary-facilitators@googlegroups.com">✉️ Email Homeroom</a>
    </div>

<script>
/* ─────────────────────────────────────────────────────────
   CONFIG
───────────────────────────────────────────────────────── */
const SHEET_ID   = '1u25ZzFmpIy51tpL6xwfGQ7ndZI6n1RsliWgXlDgvRfI';
const SHEET_NAMES = {
  noticeboard:    'Notice board',
  announcements:  'Special Announcements',
  lessonPlans:    'Daily Lesson plans',
  timetable:      'Timetable',
};
const TODAY = new Date();

/* ─────────────────────────────────────────────────────────
   HEADER DATE
───────────────────────────────────────────────────────── */
document.getElementById('hdr-day').textContent     = TODAY.getDate();
document.getElementById('hdr-weekday').textContent = TODAY.toLocaleDateString('en-IN', { weekday: 'long' });
document.getElementById('hdr-month').textContent   = TODAY.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

/* ─────────────────────────────────────────────────────────
   COLLAPSE TOGGLE
───────────────────────────────────────────────────────── */
function toggleSection(key) {
  const body  = document.getElementById(key + '-body');
  const arrow = document.getElementById(key + '-arrow');
  const open  = body.classList.toggle('open');
  arrow.classList.toggle('open', open);
}

/* ─────────────────────────────────────────────────────────
   GVIZ FETCH + PARSE
───────────────────────────────────────────────────────── */
async function fetchSheet(name) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
  try {
    const res  = await fetch(url);
    const text = await res.text();
    const s    = text.indexOf('{');
    const e    = text.lastIndexOf('}');
    if (s < 0 || e < 0) throw new Error('No JSON found');
    return JSON.parse(text.slice(s, e + 1));
  } catch(err) {
    console.error(`fetchSheet("${name}") failed:`, err);
    return null;
  }
}

/* Parse gviz JSON table → { cols:string[], rows:object[] } */
function parseTable(data) {
  if (!data?.table) return { cols: [], rows: [] };
  const cols = data.table.cols.map(c => (c.label || c.id || '').trim());
  const rows = (data.table.rows || []).map(row => {
    const obj = {};
    (row.c || []).forEach((cell, i) => {
      const k = cols[i] ?? `_c${i}`;
      if (!cell || cell.v == null) { obj[k] = ''; return; }
      if (typeof cell.v === 'string' && cell.v.startsWith('Date(')) {
        const p = cell.v.slice(5, -1).split(',').map(Number);
        obj[k] = new Date(p[0], p[1], p[2]);
      } else {
        obj[k] = (cell.f != null ? cell.f : cell.v) ?? '';
      }
    });
    return obj;
  });
  const nonEmpty = rows.filter(r => Object.values(r).some(v => v !== '' && v != null));
  return { cols, rows: nonEmpty };
}

/* ─────────────────────────────────────────────────────────
   HELPERS
───────────────────────────────────────────────────────── */
function fmtDate(d) {
  if (!(d instanceof Date) || isNaN(d)) return '';
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}
function sameDay(a, b) {
  return a instanceof Date && b instanceof Date &&
         a.getFullYear() === b.getFullYear() &&
         a.getMonth()    === b.getMonth()    &&
         a.getDate()     === b.getDate();
}

const SUBJECT_MAP = [
  { keys: ['homeroom','home room'],  cls: 'homerooms', emoji: '🏠' },
  { keys: ['english'],               cls: 'english',   emoji: '📚' },
  { keys: ['numeracy','math'],       cls: 'numeracy',  emoji: '🔢' },
  { keys: ['evlf','environment'],    cls: 'evlf',      emoji: '🌿' },
  { keys: ['art'],                   cls: 'art',       emoji: '🎨' },
  { keys: ['sport'],                 cls: 'sports',    emoji: '⚽' },
  { keys: ['skill','handwork'],      cls: 'skills',    emoji: '✂️' },
  { keys: ['thematic'],              cls: 'thematics', emoji: '🔭' },
  { keys: ['music'],                 cls: 'music',     emoji: '🎵' },
];

function subjectMeta(name) {
  const low = (name || '').toLowerCase();
  const hit = SUBJECT_MAP.find(m => m.keys.some(k => low.includes(k)));
  return hit ? { cls: hit.cls, emoji: hit.emoji } : { cls: 'default', emoji: '📌' };
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ─────────────────────────────────────────────────────────
   NOTICE BOARD
───────────────────────────────────────────────────────── */
async function loadNoticeBoard() {
  const data = await fetchSheet(SHEET_NAMES.noticeboard);
  if (!data) return;
  const { cols, rows } = parseTable(data);

  /* ── Main notice (Row 0, Col A) ── */
  const firstRow = rows[0];
  if (firstRow) {
    const raw = String(Object.values(firstRow)[0] || '').trim();
    const notice = raw.replace(/^class notice board\s*[-–—]?\s*/i, '').trim();
    if (notice) {
      document.getElementById('notice-text').textContent = notice;
      document.getElementById('notice-banner').classList.add('show');
    }
  }

  /* ── Class Norms ── */
  const normsRow = rows.find(r =>
    Object.values(r).some(v => /class norms|napkin|dress code/i.test(String(v)))
  );
  if (normsRow) {
    const normsRaw = Object.values(normsRow).find(v => String(v).length > 20) || '';
    const lines = String(normsRaw)
      .replace(/class norms[-\s]*/i, '')
      .split(/\n|\r|(?=\d+\.\s)/)
      .map(s => s.replace(/^\d+\.\s*/, '').trim())
      .filter(s => s.length > 2);
    document.getElementById('norms-body').innerHTML =
      lines.length
        ? lines.map(l => `<div class="norm-item"><span class="norm-check">✓</span><span>${esc(l)}</span></div>`).join('')
        : '<div class="empty-state" style="padding:10px 0">No norms found.</div>';
  }

  /* ── Teacher Contacts ── */
  const hdrIdx = rows.findIndex(r =>
    Object.values(r).some(v => /^names?$/i.test(String(v).trim()))
  );
  if (hdrIdx !== -1) {
    const contacts = rows.slice(hdrIdx + 1).filter(r => {
      const vals = Object.values(r).filter(v => String(v).trim());
      return vals.length >= 2;
    });
    document.getElementById('contacts-body').innerHTML = contacts.length
      ? contacts.map(r => {
          const [names, subject, emails] = Object.values(r).map(v => String(v || '').trim());
          const firstEmail = (emails || '').split(/\n|,/)[0].trim();
          return `
            <div class="contact-row">
              <div>
                <div class="contact-subject">${esc(subject || '')}</div>
                <div class="contact-name">${esc((names || '').replace(/\n/g,', '))}</div>
              </div>
              ${firstEmail
                ? `<a href="mailto:${esc(firstEmail)}" class="contact-email-link">✉️ Email</a>`
                : ''}
            </div>`;
        }).join('')
      : '<div class="empty-state" style="padding:10px 0">No contacts found.</div>';
  }
}

/* ─────────────────────────────────────────────────────────
   LESSON PLANS
───────────────────────────────────────────────────────── */
async function loadLessonPlans() {
  const lcEl  = document.getElementById('lesson-container');
  const wahEl = document.getElementById('wah-container');

  const data = await fetchSheet(SHEET_NAMES.lessonPlans);
  if (!data) {
    const errHtml = `<div class="empty-state">
      <span class="emoji">⚠️</span>
      Could not load lessons. Make sure the sheet is set to<br>
      <strong>"Anyone with the link can view"</strong> in Google Drive sharing settings.
    </div>`;
    lcEl.innerHTML  = errHtml;
    wahEl.innerHTML = errHtml;
    return;
  }

  const { cols, rows } = parseTable(data);
  if (!rows.length) {
    lcEl.innerHTML  = '<div class="empty-state"><span class="emoji">📭</span>No lesson plan entries yet.</div>';
    wahEl.innerHTML = '<div class="empty-state">Nothing yet.</div>';
    return;
  }

  /* Find key columns (case-insensitive, partial match) */
  const findCol = (...terms) =>
    cols.findIndex(c => terms.some(t => c.toLowerCase().includes(t.toLowerCase())));

  const dateColI    = findCol('date', 'day');
  const subjectColI = findCol('subject', 'class', 'period');
  const wahColI     = findCol('wah', 'homework', 'work at home', 'hw');

  /* Filter to today (or most recent past day) */
  let targetRows = [];
  let targetDate = null;

  if (dateColI >= 0) {
    const todayRows = rows.filter(r => sameDay(r[cols[dateColI]], TODAY));
    if (todayRows.length) {
      targetRows = todayRows;
      targetDate = TODAY;
    } else {
      /* Find the most recent past date */
      const pastRows = rows
        .filter(r => r[cols[dateColI]] instanceof Date && r[cols[dateColI]] < TODAY)
        .sort((a, b) => b[cols[dateColI]] - a[cols[dateColI]]);
      if (pastRows.length) {
        targetDate = pastRows[0][cols[dateColI]];
        targetRows = rows.filter(r => sameDay(r[cols[dateColI]], targetDate));
      }
    }
  } else {
    /* No date column — show last 6 rows */
    targetRows = rows.slice(-6);
  }

  /* Date label */
  const lbl = document.getElementById('lesson-date-label');
  if (targetDate && !sameDay(targetDate, TODAY)) {
    lbl.textContent = `Most recent: ${fmtDate(targetDate)}`;
  } else if (dateColI >= 0) {
    lbl.textContent = fmtDate(TODAY);
  }

  /* Render lesson cards */
  if (!targetRows.length) {
    lcEl.innerHTML = `<div class="empty-state">
      <span class="emoji">📅</span>
      No lessons recorded for today yet — check back soon!
    </div>`;
  } else {
    /* Columns to skip in the detail section */
    const skipIdx = new Set([dateColI, subjectColI, wahColI].filter(i => i >= 0));

    lcEl.innerHTML = targetRows.map(row => {
      const subjectVal = subjectColI >= 0 ? String(row[cols[subjectColI]] || '').trim() : '';
      const { cls, emoji } = subjectMeta(subjectVal);

      const details = cols
        .map((c, i) => ({ label: c, value: row[c], idx: i }))
        .filter(({ idx, value }) => !skipIdx.has(idx) && !String(value).startsWith('col') && value !== '')
        .filter(({ label }) => label && !label.startsWith('_'));

      return `
        <div class="lesson-card lesson-card--${cls}" style="margin-bottom:10px">
          <div class="lesson-subject">
            <span class="lesson-emoji">${emoji}</span>
            <span class="lesson-name">${esc(subjectVal || 'Lesson')}</span>
          </div>
          ${details.length
            ? details.map(d => `
                <div class="lesson-field">
                  <div class="lesson-field-label">${esc(d.label)}</div>
                  <div class="lesson-field-value">${esc(d.value instanceof Date ? fmtDate(d.value) : String(d.value))}</div>
                </div>`).join('')
            : '<div class="lesson-field-value" style="color:var(--ink-3)">Details coming soon…</div>'
          }
        </div>`;
    }).join('');
  }

  /* Render WAH */
  if (wahColI < 0) {
    wahEl.innerHTML = `<div class="empty-state" style="padding:14px 0">
      <span class="emoji">🔍</span>
      No "WAH" column detected in the lesson plan sheet.<br>
      <span style="font-size:11px;margin-top:4px;display:block">Columns found: ${cols.filter(c=>c).join(', ')}</span>
    </div>`;
  } else {
    const wahItems = targetRows
      .map(r => ({
        subject: subjectColI >= 0 ? String(r[cols[subjectColI]] || '').trim() : '',
        wah:     String(r[cols[wahColI]] || '').trim()
      }))
      .filter(x => x.wah);

    wahEl.innerHTML = wahItems.length
      ? wahItems.map(item => {
          const { emoji } = subjectMeta(item.subject);
          return `
            <div class="wah-card">
              ${item.subject
                ? `<div class="wah-subject-badge">${emoji} ${esc(item.subject)}</div>`
                : ''}
              <div class="wah-text">${esc(item.wah)}</div>
            </div>`;
        }).join('')
      : `<div class="empty-state" style="padding:14px 0">
           <span class="emoji">🎉</span>No homework today!
         </div>`;
  }
}

/* ─────────────────────────────────────────────────────────
   SPECIAL ANNOUNCEMENTS
───────────────────────────────────────────────────────── */
async function loadAnnouncements() {
  const el   = document.getElementById('ann-container');
  const data = await fetchSheet(SHEET_NAMES.announcements);

  if (!data) {
    el.innerHTML = '<div class="empty-state" style="padding:12px 0">Announcements unavailable.</div>';
    return;
  }

  const { cols, rows } = parseTable(data);
  if (!rows.length) {
    el.innerHTML = '<div class="empty-state" style="padding:12px 0">No announcements at this time.</div>';
    return;
  }

  const dateColI = cols.findIndex(c => c.toLowerCase().includes('date'));

  /* Sort newest first if date column exists */
  const sorted = dateColI >= 0
    ? [...rows].sort((a, b) => {
        const da = a[cols[dateColI]], db = b[cols[dateColI]];
        if (da instanceof Date && db instanceof Date) return db - da;
        return 0;
      })
    : [...rows].reverse();

  const recent = sorted.slice(0, 8);

  el.innerHTML = recent.map(row => {
    const dateVal   = dateColI >= 0 ? row[cols[dateColI]] : null;
    const dateStr   = dateVal instanceof Date ? fmtDate(dateVal) : (String(dateVal || '').trim() || '');
    const textParts = cols
      .filter((_, i) => i !== dateColI)
      .map(c => String(row[c] || '').trim())
      .filter(Boolean);

    if (!textParts.length) return '';
    return `
      <div class="ann-card">
        ${dateStr ? `<div class="ann-date">${esc(dateStr)}</div>` : ''}
        <div class="ann-text">${esc(textParts.join('\n'))}</div>
      </div>`;
  }).filter(Boolean).join('') ||
  '<div class="empty-state" style="padding:12px 0">No announcements at this time.</div>';
}

/* ─────────────────────────────────────────────────────────
   TIMETABLE
───────────────────────────────────────────────────────── */
async function loadTimetable() {
  const el   = document.getElementById('timetable-body');
  const data = await fetchSheet(SHEET_NAMES.timetable);

  if (!data) {
    el.innerHTML = '<div class="empty-state" style="padding:10px 0">Timetable unavailable.</div>';
    return;
  }

  const { cols, rows } = parseTable(data);
  if (!rows.length) {
    el.innerHTML = '<div class="empty-state" style="padding:10px 0">No timetable data yet.</div>';
    return;
  }

  const visibleCols = cols.filter(c => c && !c.startsWith('_'));

  el.innerHTML = `
    <div style="overflow-x:auto;padding-bottom:4px">
      <table class="tt-table">
        <thead>
          <tr>${visibleCols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>
        </thead>
        <tbody>
          ${rows.map(row =>
            `<tr>${visibleCols.map(c => {
              const v = row[c];
              return `<td>${v instanceof Date ? fmtDate(v) : esc(String(v || ''))}</td>`;
            }).join('')}</tr>`
          ).join('')}
        </tbody>
      </table>
    </div>`;
}

/* ─────────────────────────────────────────────────────────
   LOAD ALL
───────────────────────────────────────────────────────── */
async function loadAll() {
  document.getElementById('refresh-icon').textContent = '⏳';
  document.getElementById('status-text').textContent  = 'Fetching latest data…';

  try {
    await Promise.all([
      loadNoticeBoard(),
      loadLessonPlans(),
      loadAnnouncements(),
      loadTimetable(),
    ]);
    const t = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('status-text').textContent = `Live · Updated at ${t}`;
  } catch(e) {
    document.getElementById('status-text').textContent = 'Update failed — tap Refresh to retry';
  }

  document.getElementById('refresh-icon').textContent = '↻';
}

/* ─── Initial load + auto-refresh every 5 min ─── */
loadAll();
setInterval(loadAll, 5 * 60 * 1000);
</script>
