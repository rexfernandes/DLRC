<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Notice Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .date-btn { transition: all 0.2s; min-width: 100px; }
        .date-active { background-color: #2563eb; color: white; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4); transform: translateY(-2px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .section-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 0.75rem; display: flex; items-center: center; gap: 0.5rem; }
        .content-text { font-size: 0.9375rem; line-height: 1.6; color: #334155; }
        .highlight-box { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border: 1px solid #bfdbfe; }
    </style>
</head>
<body class="pb-12">
    <div id="app" class="max-w-md mx-auto px-5 pt-8">
        <!-- Header -->
        <header class="flex justify-between items-start mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Notice Board</h1>
                <p class="text-slate-500 font-medium mt-1">Transition Program 2026-27</p>
            </div>
            <button onclick="fetchData()" class="p-2.5 bg-white rounded-xl shadow-sm border border-slate-100 text-slate-400 hover:text-blue-600 transition-colors">
                <i data-lucide="refresh-cw" class="w-5 h-5" id="refresh-icon"></i>
            </button>
        </header>

        <!-- Date Navigation -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-3 px-1">
                <span class="text-sm font-bold text-slate-400">Select Date</span>
                <span id="last-updated" class="text-[10px] text-slate-400 uppercase font-bold">Live Syncing...</span>
            </div>
            <div class="overflow-x-auto whitespace-nowrap py-3 no-scrollbar flex gap-3" id="date-nav">
                <!-- Date buttons injected here -->
            </div>
        </div>

        <!-- Main Content -->
        <main id="main-content">
            <!-- Loading State -->
            <div id="loading" class="flex flex-col items-center justify-center py-24">
                <div class="w-12 h-12 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin mb-4"></div>
                <p class="text-slate-400 font-medium">Fetching latest updates...</p>
            </div>

            <!-- Dashboard View -->
            <div id="dashboard-view" class="hidden space-y-6">
                
                <!-- Date Header -->
                <div class="flex items-center gap-3 mb-2 px-1">
                    <div class="h-8 w-1.5 bg-blue-600 rounded-full"></div>
                    <h2 id="display-date" class="text-xl font-bold text-slate-800">---</h2>
                </div>

                <!-- WAH Card -->
                <section id="wah-section" class="card p-6 border-t-4 border-amber-400">
                    <div class="section-title">
                        <i data-lucide="home" class="w-4 h-4 text-amber-500"></i>
                        Work at Home (WAH)
                    </div>
                    <div id="wah-content" class="content-text space-y-3">
                        <p class="text-slate-400 italic">No specific tasks for today.</p>
                    </div>
                </section>

                <!-- Lessons Card -->
                <section id="lessons-section" class="card p-6 border-t-4 border-emerald-400">
                    <div class="section-title">
                        <i data-lucide="book-open" class="w-4 h-4 text-emerald-500"></i>
                        Today's Lessons
                    </div>
                    <div id="lessons-content" class="space-y-5">
                        <!-- Lessons injected here -->
                    </div>
                </section>

                <!-- General Notice Card -->
                <section id="notice-section" class="mt-10">
                    <div class="section-title px-1">
                        <i data-lucide="megaphone" class="w-4 h-4 text-blue-500"></i>
                        General Announcements
                    </div>
                    <div id="notice-content" class="card p-6 highlight-box">
                        <p class="text-slate-400 italic">Loading notices...</p>
                    </div>
                </section>
            </div>
        </main>

        <footer class="mt-12 text-center space-y-2">
            <div class="flex items-center justify-center gap-2 text-slate-300">
                <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div>
                <span class="text-[10px] font-bold uppercase tracking-widest">Real-time Dashboard</span>
            </div>
            <a href="https://docs.google.com/spreadsheets/d/1u25ZzFmpIy51tpL6xwfGQ7ndZI6n1RsliWgXlDgvRfI/edit" target="_blank" class="text-xs text-blue-500/60 hover:text-blue-600 font-medium transition-colors">View Source Spreadsheet</a>
        </footer>
    </div>

    <script>
        const SHEET_ID = '1u25ZzFmpIy51tpL6xwfGQ7ndZI6n1RsliWgXlDgvRfI';
        const GID_DAILY = '1439989763';
        const GID_NOTICE = '502021398';

        let dailyData = [];
        let noticeData = "";
        let selectedDateStr = "";

        async function fetchData() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('animate-spin');
            
            try {
                const dailyUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_DAILY}`;
                const noticeUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_NOTICE}`;

                const [dailyRes, noticeRes] = await Promise.all([
                    fetch(dailyUrl).then(res => res.text()),
                    fetch(noticeUrl).then(res => res.text())
                ]);

                parseDailyData(dailyRes);
                parseNoticeData(noticeRes);
                
                document.getElementById('last-updated').innerText = 'Updated: ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                renderApp();
            } catch (error) {
                console.error("Fetch error:", error);
            } finally {
                setTimeout(() => icon.classList.remove('animate-spin'), 500);
            }
        }

        function parseDailyData(csv) {
            const results = Papa.parse(csv, { header: false }).data;
            let currentDay = null;
            let processed = [];

            for (let i = 1; i < results.length; i++) {
                const row = results[i];
                if (!row || row.length < 2) continue;

                const dateVal = row[0] ? row[0].trim() : "";
                const component = row[1] ? row[1].trim() : "";

                if (dateVal && dateVal.toLowerCase() !== 'date' && dateVal.toLowerCase() !== 'component') {
                    currentDay = dateVal;
                }

                if (currentDay && component) {
                    processed.push({
                        date: currentDay,
                        component: component,
                        morningCircle: row[2] || "",
                        art: row[3] || "",
                        english: row[4] || "",
                        other: row.slice(5).filter(c => c && c.trim()).join(" | ")
                    });
                }
            }
            dailyData = processed;
            
            // Default to the first date if not set
            if (!selectedDateStr && dailyData.length > 0) {
                selectedDateStr = dailyData[0].date;
            }
        }

        function parseNoticeData(csv) {
            const results = Papa.parse(csv, { header: false }).data;
            let html = "";
            results.forEach(row => {
                const text = row.filter(c => c && c.trim()).join(" ");
                if (text.trim()) {
                    if (text.includes("Class Notice Board")) {
                        html += `<h3 class="font-bold text-blue-900 mb-2">${text}</h3>`;
                    } else {
                        html += `<p class="text-blue-800/80 mb-3 last:mb-0">${text}</p>`;
                    }
                }
            });
            noticeData = html || "No current announcements.";
        }

        function renderApp() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            
            renderDateNav();
            updateDisplay();
            
            document.getElementById('notice-content').innerHTML = noticeData;
            lucide.createIcons();
        }

        function renderDateNav() {
            const nav = document.getElementById('date-nav');
            nav.innerHTML = "";
            
            const uniqueDates = [...new Set(dailyData.map(d => d.date))];
            
            uniqueDates.forEach(dateStr => {
                const btn = document.createElement('button');
                const isActive = dateStr === selectedDateStr;
                btn.className = `date-btn px-5 py-2.5 rounded-2xl text-sm font-bold border transition-all flex-shrink-0 ${isActive ? 'date-active border-blue-600' : 'bg-white text-slate-500 border-slate-100 hover:border-slate-300'}`;
                btn.innerText = dateStr;
                btn.onclick = () => {
                    selectedDateStr = dateStr;
                    renderDateNav();
                    updateDisplay();
                };
                nav.appendChild(btn);
            });
        }

        function updateDisplay() {
            document.getElementById('display-date').innerText = selectedDateStr;
            
            const dayEntries = dailyData.filter(d => d.date === selectedDateStr);
            const wah = dayEntries.find(d => d.component.toLowerCase().includes('wah'));
            const lesson = dayEntries.find(d => d.component.toLowerCase().includes('lesson'));

            // Update WAH
            const wahContainer = document.getElementById('wah-content');
            if (wah) {
                let html = "";
                const fields = [
                    { label: 'Morning Circle', val: wah.morningCircle },
                    { label: 'English', val: wah.english },
                    { label: 'Art', val: wah.art },
                    { label: 'Details', val: wah.other }
                ];
                fields.forEach(f => {
                    if (f.val && f.val.trim()) {
                        html += `<div><span class="font-bold text-amber-900/40 text-[10px] uppercase block mb-0.5">${f.label}</span><p class="text-amber-900/80">${f.val}</p></div>`;
                    }
                });
                wahContainer.innerHTML = html || "<p class='text-slate-400 italic'>No specific tasks listed.</p>";
            } else {
                wahContainer.innerHTML = "<p class='text-slate-400 italic'>No WAH listed for this date.</p>";
            }

            // Update Lessons
            const lessonContainer = document.getElementById('lessons-content');
            lessonContainer.innerHTML = "";
            if (lesson) {
                const fields = [
                    { label: 'Morning Circle', val: lesson.morningCircle },
                    { label: 'English', val: lesson.english },
                    { label: 'Art', val: lesson.art },
                    { label: 'Other', val: lesson.other }
                ];
                fields.forEach(f => {
                    if (f.val && f.val.trim()) {
                        const div = document.createElement('div');
                        div.className = "group";
                        div.innerHTML = `
                            <div class="flex items-center gap-2 mb-1.5">
                                <div class="w-1.5 h-1.5 rounded-full bg-emerald-400"></div>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${f.label}</span>
                            </div>
                            <p class="text-slate-700 leading-relaxed pl-3.5 border-l border-slate-100">${f.val}</p>
                        `;
                        lessonContainer.appendChild(div);
                    }
                });
            } else {
                lessonContainer.innerHTML = "<p class='text-slate-400 italic'>No lesson plan details available.</p>";
            }

            lucide.createIcons();
        }

        // Auto-refresh every 5 minutes
        setInterval(fetchData, 300000);
        
        // Initial fetch
        fetchData();
    </script>
</body>
</html>
